services:
  db:
    image: postgres:16-alpine
    container_name: ticketeira-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketeira
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - ticketeira-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketeira"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticketeira-db:
